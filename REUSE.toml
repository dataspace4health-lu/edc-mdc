precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Luxembourg National Data Service"
SPDX-License-Identifier = "Apache-2.0"

# Pytest config
[[annotations]]
path = ["**/pytest.ini"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Luxembourg National Data Service"
SPDX-License-Identifier = "Apache-2.0"

# CSV and Excel files
[[annotations]]
path = ["**/*.csv", "**/*.xlsm", "**/*.xlsx", "**/*.xls"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Luxembourg National Data Service"
SPDX-License-Identifier = "Apache-2.0"

# Certificate files
[[annotations]]
path = ["e2e/certs/**/*"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Luxembourg National Data Service"
SPDX-License-Identifier = "Apache-2.0"

# Font files
[[annotations]]
path = ["**/*.woff", "**/*.woff2", "**/*.ttf", "**/*.otf", "**/*.eot"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Luxembourg National Data Service"
SPDX-License-Identifier = "Apache-2.0"

# Image files
[[annotations]]
path = ["**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.gif", "**/*.ico", "**/*.webp"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Luxembourg National Data Service"
SPDX-License-Identifier = "Apache-2.0"

# Dockerfile in subdirectories
[[annotations]]
path = ["**/Dockerfile"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Luxembourg National Data Service"
SPDX-License-Identifier = "Apache-2.0"
