sonar.projectKey=lnds-lu_service-library_dca-metadata-capture_88f6b5d6-4763-40a3-afd6-853e262d4fdf
sonar.qualitygate.wait=true
sonar.python.coverage.reportPaths=app/coverage.xml
sonar.coverage.exclusions=**__init__**,app/tests/**,*.py
sonar.exclusions=*.xml
sonar.sources=app/


# Ignore multiple types of issues - MUST list all criteria here
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12

# Ignore empty function rule for Alembic migrations
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1186
sonar.issue.ignore.multicriteria.e1.resourceKey=**/alembic/versions/*.py

# Alternative for brain-overload (cognitive complexity)
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.py

sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.tsx

sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.ts

# Ignore duplicate string literals rule specifically
sonar.issue.ignore.multicriteria.e5.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.py

# Ignore 4 levels deep
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S2004
sonar.issue.ignore.multicriteria.e6.resourceKey=**/*.ts

sonar.issue.ignore.multicriteria.e7.ruleKey=typescript:S2004
sonar.issue.ignore.multicriteria.e7.resourceKey=**/*.tsx

# Ignore nested ternary operation into an independent statement
sonar.issue.ignore.multicriteria.e8.ruleKey=typescript:S3358
sonar.issue.ignore.multicriteria.e8.resourceKey=**/*.ts

sonar.issue.ignore.multicriteria.e9.ruleKey=typescript:S3358
sonar.issue.ignore.multicriteria.e9.resourceKey=**/*.tsx

# Ignore use a normal string instead of an f-string
sonar.issue.ignore.multicriteria.e10.ruleKey=python:S3457
sonar.issue.ignore.multicriteria.e10.resourceKey=**/*.py

# Ignore The object passed as the value prop to the Context provider changes every render. To fix this consider wrapping it in a useMemo hook
sonar.issue.ignore.multicriteria.e11.ruleKey=typescript:S6481
sonar.issue.ignore.multicriteria.e11.resourceKey=**/*.tsx

# Ignore greater than the 13 authorized parameters
sonar.issue.ignore.multicriteria.e12.ruleKey=python:S107
sonar.issue.ignore.multicriteria.e12.resourceKey=**/*.py
